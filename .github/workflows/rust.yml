name: Verify JNI completion on macOS

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run JNI completion tests
        run: cargo test --locked --test jni_completion_tests -- --test-threads=1
      - name: Run bootstrap regression tests
        run: cargo test --locked --test integration_tests -- should_support_file_input_stream_exceptions should_support_wide_instructions --test-threads=1
